<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AcciAlert Admin Login</title>
  <link rel="stylesheet" href="static/css/login.css">
</head>
<body>
  <div class="blob a"></div><div class="blob b"></div><div class="blob c"></div>
  <div class="wrap">
    <div class="logo" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    </div>
    <h1>Admin Panel</h1>
    <p class="sub">Enter the admin password.</p>
    <form id="form" class="card" autocomplete="off" style="max-width:420px">
      <input id="pw" class="pw" type="password" placeholder="Password" autofocus required aria-label="Admin password">
      <div id="err" class="err" role="alert"></div>
      <div class="row">
        <a class="btn btn-ghost" href="/">Back</a>
        <button class="btn btn-main" type="submit">Login</button>
      </div>
    </form>
  </div>
  <script>
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("err"); err.textContent = "";
      try {
        const res = await fetch("/api/admin/login", { method: "POST", headers: { "Content-Type": "application/json" },
                                                      body: JSON.stringify({ password: document.getElementById("pw").value }) });
        const body = await res.json().catch(() => ({}));
        if (res.ok) { location.href = "/admin"; return; }
        err.textContent = body.message || "Login failed.";
        document.getElementById("pw").value = "";
        const card = document.getElementById("form"); card.classList.remove("bad"); void card.offsetWidth; card.classList.add("bad");
      } catch (_) { err.textContent = "Cannot reach the server."; }
    });
  </script>
  <style>#form.bad { animation: shake .45s; }</style>
</body>
</html>
